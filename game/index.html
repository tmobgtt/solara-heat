<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #testlog { position: fixed; left: 8px; top: 8px; margin: 0; padding: 8px 10px; display: none;
    background: rgba(5, 8, 12, 0.88); color: #b8ffb0; font: 12px/1.5 monospace; white-space: pre-wrap; z-index: 5; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Heat: explore the city of Solara on foot and by car, run story jobs, and outrun the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testlog" aria-hidden="true"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
